<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ToolKit · 在线效率工具集合：JSON 格式化、时间戳转换、编码转换、正则测试、Markdown 预览等 23 款工具，前端工具在浏览器本地运行，即开即用。"
    />
    <link rel="icon" type="image/png" href="/icon.png" />
    <title>ToolKit · 在线效率工具集合</title>
    <script>
      // 首屏主题（避免闪烁）：键名与 stores/theme.ts 的 STORAGE_KEY 保持一致
      ;(function () {
        try {
          var t = localStorage.getItem('toolkit:theme')
          if (t === 'dark' || t === 'light' || t === 'ocean' || t === 'rose') {
            document.documentElement.dataset.theme = t
            return
          }
        } catch (e) {}
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
